<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>LeatherCulture Admin</title>
    <link href="/assets/brand/leather-culture-mark.png" rel="icon" type="image/png" />
    <link rel="stylesheet" href="/admin/styles.css?v=wp-1" />
  </head>
  <body class="locked">
    <div id="login-screen" class="login-screen">
      <form id="login-form" class="login-card">
        <img src="/assets/brand/leather-culture-logo-black.webp" alt="LeatherCulture" class="login-logo" />
        <h1>Sign in to Admin</h1>
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="primary">Login</button>
        <div id="login-status" role="status"></div>
      </form>
    </div>

    <aside class="sidebar">
      <a class="brand" href="#/">
        <img src="/assets/brand/leather-culture-logo-white.webp" alt="LeatherCulture" />
      </a>
      <nav id="nav">
        <a href="#/" data-route="dashboard"><span class="ico">▦</span>Dashboard</a>
        <div class="nav-group">Store</div>
        <a href="#/products" data-route="products"><span class="ico">◈</span>Products</a>
        <a href="#/categories" data-route="categories"><span class="ico">◫</span>Categories</a>
        <a href="#/banners" data-route="banners"><span class="ico">▭</span>Banners</a>
        <div class="nav-group">Content</div>
        <a href="#/blog" data-route="blog"><span class="ico">✎</span>Blog Posts</a>
        <a href="#/pages" data-route="pages"><span class="ico">▤</span>Pages &amp; SEO</a>
        <a href="#/content" data-route="content"><span class="ico">¶</span>Page Text</a>
        <div class="nav-group">Design</div>
        <a href="#/appearance" data-route="appearance"><span class="ico">◐</span>Appearance</a>
      </nav>
      <div class="sidebar-foot">
        <a href="/" target="_blank" rel="noopener">↗ View store</a>
        <button id="logout" type="button" class="link">Log out</button>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button id="menu-toggle" type="button" class="icon-btn" aria-label="Menu">☰</button>
        <div class="topbar-title">
          <div id="crumbs" class="crumbs"></div>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <span id="dirty" class="dirty" hidden>Unsaved changes</span>
          <button id="save" type="button" class="primary" disabled>Save changes</button>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="/site-config.js?v=split-1"></script>
    <script src="/admin/script.js?v=wp-1"></script>
  </body>
</html>
