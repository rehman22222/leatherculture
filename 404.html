<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | LeatherCulture</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/brand/leather-culture-mark.png">
<link rel="stylesheet" href="/store.css?v=404-1">
<style>
  .nf { text-align: center; padding: 40px 0 10px; }
  .nf .code { font-size: clamp(64px, 18vw, 128px); line-height: 1; font-weight: 700; letter-spacing: -0.05em; margin: 0; }
  .nf h1 { font-size: clamp(22px, 5vw, 32px); margin: 6px 0 12px; }
  .nf p { color: var(--muted); max-width: 46ch; margin: 0 auto 26px; }
  .nf .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; max-width: 460px; margin: 0 auto; }
  .nf .actions .btn { width: auto; min-width: 190px; }
  .picks { margin-top: 52px; }
  .picks h2 { text-align: center; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .pick { display: block; text-decoration: none; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .pick img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #eee; }
  .pick .meta { padding: 12px 14px; }
  .pick .name { font-weight: 600; }
  .pick .price { color: var(--muted); }
  .links { margin-top: 44px; text-align: center; }
  .links a { margin: 0 10px; }
  @media (max-width: 860px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header class="site-header">
  <a href="/" aria-label="LeatherCulture"><img src="/assets/brand/leather-culture-logo-white.webp" alt="LeatherCulture"></a>
  <nav><a href="/shop">Shop</a><a href="/blog">Blog</a><a href="/contact">Help</a></nav>
</header>
<main>
  <section class="nf">
    <p class="code">404</p>
    <h1>We couldn't find that page</h1>
    <p>The link may be old, or the piece you're after has sold out. Everything currently in stock is one tap away.</p>
    <div class="actions">
      <a class="btn" href="/shop">Shop the collection</a>
      <a class="btn ghost" href="/">Back to home</a>
    </div>
  </section>

  <section class="picks" id="picks" hidden>
    <h2>Popular right now</h2>
    <div class="grid" id="picks-grid"></div>
  </section>

  <nav class="links">
    <a href="/">Home</a><a href="/shop">Shop</a><a href="/about">About</a><a href="/blog">Blog</a><a href="/contact">Contact</a>
  </nav>
</main>
<footer class="site-footer">Cash on delivery across Pakistan · <a href="/contact">Contact us</a></footer>

<script src="/site-config.js?v=split-1"></script>
<script src="/cart.js?v=cart-5"></script>
<script>
(function () {
  const apiBase = String(window.LEATHERCULTURE_API_BASE || "").replace(/\/$/, "");
  const Cart = window.LeatherCultureCart;
  const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  fetch(`${apiBase}/api/storefront/products`, { cache: "no-store" })
    .then((response) => (response.ok ? response.json() : []))
    .then((products) => {
      const live = products.filter((product) => product.enabled !== false && product.image).slice(0, 4);
      if (!live.length) return;
      document.getElementById("picks-grid").innerHTML = live
        .map(
          (product) => `<a class="pick" href="/shop/${esc(product.slug || product.id)}">
            <img src="${esc(Cart ? Cart.mediaUrl(product.image) : product.image)}" alt="${esc(product.alt || product.name)}" loading="lazy">
            <div class="meta"><div class="name">${esc(product.name)}</div><div class="price">${esc(product.price || "")}</div></div>
          </a>`
        )
        .join("");
      document.getElementById("picks").hidden = false;
    })
    .catch(() => {});
})();
</script>
</body>
</html>
